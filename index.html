<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0e0e0e;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            max-width: 400px;
            padding: 2rem;
        }

        .logo-area {
            margin-bottom: 2rem;
        }

        .status-text {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 1rem;
        }

        .progress-info {
            font-size: 0.9rem;
            color: #b0b0b0;
            margin-bottom: 2rem;
        }

        .progress-container {
            width: 100%;
            height: 2px;
            background-color: #323232;
            border-radius: 1px;
            margin: 1.5rem 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: #00ccff;
            width: 0%;
            transition: width 1s ease;
        }

        .countdown-display {
            font-size: 2rem;
            font-weight: 600;
            color: #00ccff;
            margin: 1rem 0;
            font-variant-numeric: tabular-nums;
        }

        .manual-link {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #323232;
        }

        .manual-link a {
            color: #0099cc;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            border: 1px solid #0099cc;
            border-radius: 4px;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .manual-link a:hover {
            background-color: #007acc;
            color: #ffffff;
            border-color: #007acc;
        }

        .loading-dots {
            display: inline-flex;
            gap: 0.25rem;
            margin-left: 0.5rem;
        }

        .loading-dots span {
            width: 4px;
            height: 4px;
            background-color: #00ccff;
            border-radius: 50%;
            animation: loading 1.4s ease-in-out infinite;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        .loading-dots span:nth-child(3) { animation-delay: 0s; }

        @keyframes loading {
            0%, 80%, 100% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            40% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
            
            .status-text {
                font-size: 1.3rem;
            }
            
            .countdown-display {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-area">
            <div class="status-text">Redirecionando</div>
            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div class="progress-info">
            Preparando a página inicial
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="countdown-display" id="countdown">3</div>

        <div class="manual-link">
            <a href="../public/home.html" id="manualLink">Acessar diretamente</a>
        </div>
    </div>

    <script>
        let timeLeft = 1;
        const countdownEl = document.getElementById('countdown');
        const progressBar = document.getElementById('progressBar');
        const manualLink = document.getElementById('manualLink');

        function updateProgress() {
            const progress = ((3 - timeLeft) / 3) * 100;
            progressBar.style.width = progress + '%';
        }

        function updateCountdown() {
            countdownEl.textContent = timeLeft;
            updateProgress();
            
            if (timeLeft <= 0) {
                window.location.href = '../public/home.html';
                return;
            }
            
            timeLeft--;
            setTimeout(updateCountdown, 1000);
        }

        manualLink.addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = '../public/home.html';
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                window.location.href = '../public/home.html';
            }
        });

        updateCountdown();
    </script>
</body>
</html>
